[main]
dpi-aware=no

# Layout
anchor=center
width=45
lines=8
use-bold=no

# Spacing
horizontal-pad=28
vertical-pad=20
inner-pad=8
letter-spacing=0
line-height=28

# Prompt
prompt="❯ "
match-counter=no

# Icons
icons-enabled=yes
image-size-ratio=0.5

# Behavior
match-mode=fzf
fields=filename,name,generic
layer=overlay

[border]
width=1
radius=12
selection-radius=8

# Font and colours are generated by `rice`.
[main]
include=~/.config/fuzzel/rice.ini
